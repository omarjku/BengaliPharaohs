<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset · DhanSathi</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f7f5ec; color: #1f3a2a; font: 18px/1.6 system-ui, sans-serif; text-align: center; padding: 24px; }
      .box { max-width: 360px; }
      b { color: #1f6b3e; }
    </style>
  </head>
  <body>
    <div class="box">
      <p id="msg">পুরনো সংস্করণ মোছা হচ্ছে…<br />Clearing the old version…</p>
    </div>
    <script>
      // Removes the offline copy (service worker + caches) so the phone downloads the newest app.
      // Saved cases and the farm profile (IndexedDB) are kept.
      (async () => {
        const msg = document.getElementById("msg");
        try {
          const regs = (await navigator.serviceWorker?.getRegistrations?.()) || [];
          await Promise.all(regs.map((r) => r.unregister()));
          const keys = (await caches?.keys?.()) || [];
          await Promise.all(keys.map((k) => caches.delete(k)));
          msg.innerHTML = "হয়ে গেছে। নতুন সংস্করণ খোলা হচ্ছে…<br />Done. Opening the newest version…";
        } catch (e) {
          msg.textContent = "Reset failed: " + e;
          return;
        }
        setTimeout(() => location.replace("/?fresh=" + Date.now()), 800);
      })();
    </script>
  </body>
</html>
